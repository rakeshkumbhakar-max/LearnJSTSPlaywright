# ---------------------------------------------------------------------------
# Base framework configuration (shared by every environment).
# Any key here can be overridden with a JVM system property, e.g.
#   mvn test -Dbrowser=firefox -Dheadless=true
# ---------------------------------------------------------------------------

# Active environment: qa | staging | prod
env=qa

# Browser: chrome | firefox | edge
browser=chrome

# Run the browser without a visible UI
headless=false

# Timeouts (seconds)
implicit.wait=5
explicit.wait=20
page.load.timeout=60
script.timeout=30

# Retry budget for the RetryAnalyzer (per test method)
retry.count=1

# Capture a screenshot and attach it to the report when a test fails
screenshot.on.failure=true
